name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      merged_pr: ${{ steps.merged_pr.outputs.merged_pr }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this push is a PR merge
        if: github.event_name == 'push'
        id: merged_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")
          if echo "$prs" | jq -e --arg sha "$GITHUB_SHA" \
            '.[] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $sha)' >/dev/null; then
            echo "merged_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged_pr=false" >> "$GITHUB_OUTPUT"
            echo "No merged pull request matched this commit; apply will be skipped."
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  apply:
    if: github.event_name == 'push' && needs.validate.outputs.merged_pr == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Reject stale deployments
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "main has advanced; deploy its latest merged commit instead."
            exit 1
          }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Initialize Terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - run: terraform plan -input=false -out=tfplan
      - run: terraform apply -input=false tfplan
